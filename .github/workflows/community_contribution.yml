name: "Community contribution"
on:
  pull_request_target:
    types: [opened, reopened, edited]

jobs:
  community-pr-message:
    if: ${{ github.event.action != 'edited' || (github.event.pull_request.state == 'closed' && !github.event.pull_request.merged) }}
    concurrency:
      group: community-contribution-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      USER_LOGIN: ${{ github.event.pull_request.user.login }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    runs-on: ubuntu-24.04
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
    permissions:
      id-token: write # Required for OIDC (Vault ephemeral token)
      issues: write
      pull-requests: write
    steps:
      - name: Fetch ephemeral GitHub token
        id: fetch_ephemeral_token
        uses: elastic/ci-gh-actions/fetch-github-token@v1.5.3
        with:
          vault-instance: ci-prod
          vault-role: token-policy-7c76c3b2363a
      - name: Check for org membership
        # https://docs.github.com/en/rest/orgs/members?apiVersion=2022-11-28#check-organization-membership-for-a-user
        id: org_membership
        env:
          GH_TOKEN: ${{ steps.fetch_ephemeral_token.outputs.token }}
        run: |
          set -euo pipefail
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/elastic/members/$USER_LOGIN")

          case "$HTTP_CODE" in
            204)
              echo "Elastic org member"
              echo "is_member=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "Not an Elastic org member"
              echo "is_member=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected membership API status: ${HTTP_CODE:-empty}"
              exit 1
              ;;
          esac
      - name: Comment on community pull requests
        if: ${{ steps.org_membership.outputs.is_member == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          USER_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail

          guidelines='https://github.com/elastic/eui/blob/main/wiki/contributing-to-eui/README.md'
          help_wanted='https://github.com/elastic/eui/issues?q=is%3Aopen+is%3Aissue+label%3A%22help+wanted%22'
          new_issue='https://github.com/elastic/eui/issues/new/choose'
          marker='<!-- community-contribution-autoclose -->'

          # Authors without write access can't reopen a pull request the bot closed, so the bot reopens it after an edit
          if [[ "$ACTION" == edited ]]; then
            # A queued run can start after an earlier one already reopened the pull request
            closed_by=$(gh api "repos/$GH_REPO/issues/$PR_NUMBER" --jq 'if .state == "closed" then .closed_by.login // "" else "" end')
            # The stale workflow also closes as github-actions[bot], so the bot's latest comment must be this workflow's
            auto_closed=$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/comments" \
              --jq '.[] | select(.user.login == "github-actions[bot]") | .body | contains("<!-- community-contribution-autoclose -->")' \
              | tail -n 1)
            if [[ "$closed_by" != "github-actions[bot]" || "$auto_closed" != true ]]; then
              echo "Not closed by this workflow; nothing to do."
              exit 0
            fi
          fi

          # The event payload can be older than an edit made while this run was queued
          pr_body=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.body // ""')

          issue_numbers=$(
            printf '%s\n' "$pr_body" \
              | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+(https://github\.com/elastic/eui/issues/|#|elastic/eui#)[0-9]+' \
              | grep -oE '[0-9]+$' \
              | sort -u \
              || true
          )

          has_help_wanted=false
          failed=0
          for issue_number in $issue_numbers; do
            # The issues endpoint also returns pull requests
            if result=$(gh api "repos/$GH_REPO/issues/$issue_number" \
              --jq '.pull_request == null and .state == "open" and any(.labels[]; .name == "help wanted")' 2>&1); then
              if [[ "$result" == true ]]; then
                has_help_wanted=true
                break
              fi
            else
              case "$result" in
                *"HTTP 404"* | *"HTTP 410"*) ;;
                *) failed=$((failed + 1)) ;;
              esac
            fi
          done

          if [[ "$has_help_wanted" != true && "$failed" -gt 0 ]]; then
            if [[ "$ACTION" == edited ]]; then
              echo "::warning::Could not read linked issues; leaving the pull request closed."
              exit 0
            fi
            echo "::warning::Could not read linked issues; leaving the pull request open."
            has_help_wanted=true
          fi

          # Only the author or someone with write access can reopen, so a reopen by anyone else is a maintainer override.
          # Bot pull requests don't link issues, so they're never closed.
          if [[ "$USER_TYPE" == Bot || ( "$ACTION" == reopened && "$SENDER_LOGIN" != "$USER_LOGIN" ) ]]; then
            has_help_wanted=true
          fi

          if [[ "$has_help_wanted" != true && "$ACTION" == edited ]]; then
            echo "Still no open help wanted issue; leaving the pull request closed."
            exit 0
          fi

          if [[ "$has_help_wanted" != true ]]; then
            if [[ -z "$issue_numbers" ]]; then
              reason="This pull request isn't linked to an issue."
            else
              reason="None of the issues this pull request closes is open and labelled \`help wanted\`."
            fi

            body=$(cat <<EOF
          $marker
          👋 Thanks for your interest in contributing to EUI! We only accept community pull requests for open issues labelled [\`help wanted\`]($help_wanted), so we're closing this one. $reason

          To get it reviewed:

          1. Find an open issue labelled \`help wanted\`. If the issue you're working on doesn't have that label, comment on it with your proposed solution. We'll add the label if we agree.
          2. Edit this pull request's description to link that issue with a closing keyword, e.g. \`Fixes #123\`, \`Closes #123\` or \`Resolves #123\`. Mentions like "related to #123", closed issues and pull requests don't count.

          We'll reopen this pull request automatically once its description links an open \`help wanted\` issue. If the label is added after your last edit, edit the description again to rerun the check.

          If you need a capability that doesn't have an issue yet, [open one]($new_issue) and wait for us to discuss it before writing code. Opening an issue isn't enough on its own: we add \`help wanted\` only once we've agreed on the change and want it contributed. See our [contribution guidelines]($guidelines) for details.
          EOF
            )

            gh pr close "$PR_NUMBER" --comment "$body"
            exit 0
          fi

          if [[ "$ACTION" == edited ]]; then
            gh pr reopen "$PR_NUMBER"
          fi

          gh pr comment "$PR_NUMBER" --body "👋 Since this is a community submitted pull request, a Buildkite build has not been started automatically. Would an Elastic organization member please verify the contents of this pull request and kick off a build manually?"
          gh pr edit "$PR_NUMBER" --add-label "community contribution"
