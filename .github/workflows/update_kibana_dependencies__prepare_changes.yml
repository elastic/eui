################################################################################
# This workflow file is part of the chain of workflows focused on testing
# EUI changes in Kibana as part of our regression integration testing.
#
# This workflow is dispatched from `release.yml` after a snapshot is published
# and should not be run manually.
#
# Due to technical limitations and security rules, steps had to be divided
# into multiple subworkflows that must be triggered through
# `workflow_dispatch` and not the usual `workflow_call`.
################################################################################

name: 'Update Kibana dependencies - Prepare changes'

on:
  workflow_dispatch:
    inputs:
      dependencies:
        description: JSON-serialized map of dependencies to update
        type: string
        required: true
      pr_title:
        description: PR title
        required: true
        type: string
      pr_body:
        description: PR body
        type: string
      source_pr_number:
        description: Source PR number that triggered this workflow
        type: number
      nightly:
        description: Whether this is the scheduled nightly run
        type: boolean
        default: false
      eui_ref:
        description: EUI ref used to publish the snapshot
        type: string
        required: true
      eui_last_release:
        description: Latest stable EUI release reachable from the snapshot
        type: string
      eui_version:
        description: Published @elastic/eui snapshot version
        type: string
concurrency:
  group: ${{ inputs.nightly && 'kibana-nightly' || format('prepare-kibana-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
permissions:
  id-token: write # Required for OIDC (Vault ephemeral token)
  contents: read
  actions: write # Required to dispatch the open-PR workflow

jobs:
  update:
    name: Prepare changes
    runs-on: ubuntu-latest
    steps:
      - name: Verify dependencies input
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        # language=bash
        run: |
          if ! num_deps="$(jq 'map(select(has("name") and has("version"))) | length' <<< "$DEPENDENCIES")"; then
            echo "::error::Invalid dependencies input"
            exit 2
          elif [[ "$num_deps" -eq 0 ]]; then
            echo "::warning::No dependencies to update"
            exit 1
          else
            echo "$num_deps dependencies to update"
          fi
      - name: Checkout the upstream elastic/kibana repository
        uses: actions/checkout@v6
        with:
          repository: elastic/kibana
          fetch-depth: 1
          persist-credentials: false # We use different credentials for other git operations
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # Don't cache anything as it's a different repository
      - name: Fetch ephemeral GitHub token
        id: fetch_ephemeral_token
        uses: elastic/ci-gh-actions/fetch-github-token@v1.5.3
        with:
          vault-instance: ci-prod
          vault-role: token-policy-4fabc48bd03f
      - name: Configure git
        env:
          GH_TOKEN: ${{ steps.fetch_ephemeral_token.outputs.token }}
        # language=bash
        run: |
          gh auth setup-git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add fork https://github.com/elastic/eui-kibana.git
      - name: Create new branch
        id: git_branch
        env:
          NIGHTLY: ${{ inputs.nightly }}
        # language=bash
        run: |
          # Nightly runs reuse a fixed branch; all other runs remain unique.
          if [[ "$NIGHTLY" == "true" ]]; then
            branch_name="nightly/update-dependencies"
          else
            branch_name="update-dependencies/$(date +%s)"
          fi
          git checkout -b "$branch_name"
          echo "BRANCH_NAME=$branch_name" >> "$GITHUB_OUTPUT"
          echo "::debug::Created branch '$branch_name'"
      - name: Cherry-pick Kibana prep commits
        id: cherry_pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # language=bash
        run: |
          set -euo pipefail

          prep_commits=$(gh api repos/elastic/eui/contents/packages/release-cli/kibana-prep-commits \
            --jq '.content' | base64 -d | grep -v '^\s*#' | grep -v '^\s*$' | sort -u || true)

          if [[ -z "$prep_commits" ]]; then
            echo "No Kibana prep commits to cherry-pick"
            exit 0
          fi

          notes=""

          while IFS= read -r url; do
            pr_number=$(grep -oP '(?<=/pull/)\d+' <<< "$url")
            sha=$(grep -oP '[0-9a-f]{40}$' <<< "$url")

            if [[ -z "$pr_number" || -z "$sha" ]]; then
              echo "::warning::Could not parse URL: $url"
              continue
            fi

            echo "Cherry-picking $sha from PR #$pr_number"
            git fetch origin "pull/$pr_number/head"
            git cherry-pick "$sha"

            short_sha="${sha:0:8}"
            notes+="- [\`$short_sha\`](https://github.com/elastic/kibana/pull/$pr_number/commits/$sha) from elastic/kibana#$pr_number"$'\n'
          done <<< "$prep_commits"

          if [[ -n "$notes" ]]; then
            {
              echo 'cherry_pick_notes<<CHERRY_PICK_DELIMITER'
              printf '%s' "$notes"
              echo 'CHERRY_PICK_DELIMITER'
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Save current EUI i18n tokens
        id: save_old_tokens
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EUI_LAST_RELEASE: ${{ inputs.eui_last_release }}
        # language=bash
        run: |
          set -euo pipefail

          # Resolve the ref for the current @elastic/eui version in Kibana.
          # Release builds have a git tag (v{version}); snapshot builds don't,
          # so we fall back to eui_last_release as the stable baseline.
          current_version=$(node -pe "
            const p = require('./package.json');
            (p.devDependencies?.['@elastic/eui'] || p.dependencies?.['@elastic/eui'] || '')
              .replace(/^[^0-9]*/, '')
          ")

          if [[ "$current_version" == *"-snapshot"* ]]; then
            if [[ -z "${EUI_LAST_RELEASE:-}" ]]; then
              echo "::warning::Current @elastic/eui is a snapshot and eui_last_release was not provided — skipping i18n token sync"
              echo "SKIP=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            ref="v${EUI_LAST_RELEASE}"
          else
            ref="v${current_version}"
          fi

          echo "Fetching i18ntokens.json from elastic/eui at ref $ref"
          gh api "repos/elastic/eui/contents/packages/eui/i18ntokens.json?ref=${ref}" \
            --header "Accept: application/vnd.github.raw" \
            > /tmp/old_i18ntokens.json

          echo "SKIP=false" >> "$GITHUB_OUTPUT"
          echo "OLD_TOKENS_PATH=/tmp/old_i18ntokens.json" >> "$GITHUB_OUTPUT"
      - name: Update dependency versions
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        # language=bash
        run: |
          jq -j '.[] | .name, "\u0000", .version, "\u0000"' <<< "$DEPENDENCIES" |
          xargs -0 -n 2 bash -c '
            pkg="$0"
            ver="$1"
            if [[ $(npm pkg get "devDependencies.$pkg") != "{}" ]]; then
              npm pkg set "devDependencies.$pkg=$ver"
            elif [[ $(npm pkg get "dependencies.$pkg") != "{}" ]]; then
              npm pkg set "dependencies.$pkg=$ver"
            else
              echo "::warning::Skipping $pkg: Not found in either dependencies or devDependencies";
            fi'
      - name: Run Kibana bootstrap script and normalize dependencies
        # language=bash
        run: |
          yarn kbn bootstrap
          node scripts/yarn_deduplicate
          yarn kbn bootstrap --force-install
      - name: Sync EUI i18n tokens
        if: steps.save_old_tokens.outputs.SKIP != 'true'
        env:
          OLD_TOKENS: ${{ steps.save_old_tokens.outputs.OLD_TOKENS_PATH }}
          MAPPING_FILE: src/core/packages/i18n/browser-internal/src/i18n_eui_mapping.tsx
        # language=bash
        run: |
          set -euo pipefail

          export NEW_TOKENS
          NEW_TOKENS=$(node -e "console.log(require.resolve('@elastic/eui/i18ntokens.json'))" 2>/dev/null || true)
          if [[ -z "$NEW_TOKENS" || ! -f "$MAPPING_FILE" ]]; then
            echo "::warning::Cannot locate token files — skipping i18n sync"; exit 0
          fi

          node << 'SCRIPT'
          const fs = require('fs');
          const old = new Map(JSON.parse(fs.readFileSync(process.env.OLD_TOKENS)).map(t => [t.token, t.defString]));
          const next = new Map(JSON.parse(fs.readFileSync(process.env.NEW_TOKENS)).map(t => [t.token, t.defString]));
          const file = process.env.MAPPING_FILE;

          const added = [], removed = [], modified = [];
          for (const [t, d] of old) !next.has(t) ? removed.push(t) : next.get(t) !== d && modified.push({ token: t, defString: next.get(t) });
          for (const [t, d] of next) !old.has(t) && added.push({ token: t, defString: d });

          if (!added.length && !removed.length && !modified.length) { console.log('No token changes'); process.exit(0); }
          console.log(`Tokens: +${added.length} added  -${removed.length} removed  ~${modified.length} modified`);

          function mkEntry(token, def) {
            const vars = [...new Set((def.match(/\{([a-zA-Z0-9_]+)\}/g) || []).map(m => m.slice(1, -1)))];
            const esc = def.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
            const k = `'core.${token}'`;
            return vars.length
              ? `    '${token}': ({ ${vars} }: EuiValues) =>\n      i18n.translate(${k}, {\n        defaultMessage: '${esc}',\n        values: { ${vars} },\n      }),`
              : `    '${token}': i18n.translate(${k}, {\n      defaultMessage: '${esc}',\n    }),`;
          }

          function parseMap(content) {
            const lines = content.split('\n');
            const starts = [];
            let closing = lines.length - 1;
            lines.forEach((l, i) => { const m = /^    '(eui[^']+)':/.exec(l); if (m) starts.push({ token: m[1], i }); else if (/^  \};/.test(l)) closing = i; });
            const map = new Map();
            starts.forEach(({ token, i }, j) => { let e = j + 1 < starts.length ? starts[j + 1].i - 1 : closing - 1; while (e > i && !lines[e].trim()) e--; map.set(token, { s: i, e }); });
            return { map, closing };
          }

          let lines = fs.readFileSync(file, 'utf8').split('\n');
          const { map } = parseMap(lines.join('\n'));
          const ops = [
            ...removed.map(t => map.get(t) && { ...map.get(t), text: null }),
            ...modified.map(({ token, defString }) => map.get(token) && { ...map.get(token), text: mkEntry(token, defString) }),
          ].filter(Boolean).sort((a, b) => b.s - a.s);

          for (const { s, e, text } of ops) lines.splice(s, e - s + 1, ...(text ? text.split('\n') : []));

          if (added.length) {
            const c = lines.join('\n');
            const { closing } = parseMap(c);
            lines = c.split('\n');
            lines.splice(closing, 0, ...added.sort((a, b) => a.token.localeCompare(b.token)).flatMap(({ token, defString }) => mkEntry(token, defString).split('\n')));
          }

          fs.writeFileSync(file, lines.join('\n'));
          console.log('Patched', file);
          SCRIPT

          if ! git diff --quiet "$MAPPING_FILE"; then
            node scripts/jest --testPathPattern i18n_eui_mapping --updateSnapshot 2>&1 || true
            git add "$MAPPING_FILE"
            git add "src/core/packages/i18n/browser-internal/src/__snapshots__/" 2>/dev/null || true
            git diff --cached --quiet || git commit -m "chore: sync EUI i18n tokens"
          fi
      - name: Commit changed files
        # language=bash
        run: |
          git add package.json yarn.lock src/platform/packages/private/kbn-ui-shared-deps-npm/version_dependencies.txt
          git commit -m "chore: update dependencies"
      - name: Push branch to elastic/eui-kibana
        env:
          GH_TOKEN: ${{ steps.fetch_ephemeral_token.outputs.token }}
          BRANCH_NAME: ${{ steps.git_branch.outputs.BRANCH_NAME }}
          NIGHTLY: ${{ inputs.nightly }}
        # language=bash
        run: |
          if [[ "$NIGHTLY" == "true" ]]; then
            git push -u --force fork "$BRANCH_NAME"
          else
            git push -u fork "$BRANCH_NAME"
          fi
      - name: Trigger workflow to open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          CHERRY_PICK_NOTES: ${{ steps.cherry_pick.outputs.cherry_pick_notes }}
          BRANCH_NAME: ${{ steps.git_branch.outputs.BRANCH_NAME }}
          SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
          NIGHTLY: ${{ inputs.nightly }}
          EUI_REF: ${{ inputs.eui_ref }}
          EUI_LAST_RELEASE: ${{ inputs.eui_last_release }}
          EUI_VERSION: ${{ inputs.eui_version }}
        # language=bash
        run: |
          set -euo pipefail

          if [[ -n "${CHERRY_PICK_NOTES:-}" ]]; then
            PR_BODY="${PR_BODY}"$'\n\n'"### Cherry-picked commits"$'\n\n'"${CHERRY_PICK_NOTES}"
          fi

          # --repo is required because we're in the context of elastic/kibana right now
          args=(
            --repo elastic/eui
            -f "pr_title=$PR_TITLE"
            -f "pr_body=$PR_BODY"
            -f "pr_head=$BRANCH_NAME"
            -f "nightly=$NIGHTLY"
            -f "eui_ref=$EUI_REF"
            -f "eui_last_release=$EUI_LAST_RELEASE"
            -f "eui_version=$EUI_VERSION"
          )
          # An empty value is invalid for a number-typed workflow input.
          if [[ -n "${SOURCE_PR_NUMBER:-}" ]]; then
            args+=( -f "source_pr_number=$SOURCE_PR_NUMBER" )
          fi
          workflow_url=$(gh workflow run update_kibana_dependencies__open_pr.yml "${args[@]}")

          {
            echo "### Success :rocket:"
            echo ""
            echo "* Changes are prepared and pushed: https://github.com/elastic/eui-kibana/tree/$BRANCH_NAME"
            echo "* Pull request creation workflow triggered: $workflow_url"
          } >> "$GITHUB_STEP_SUMMARY"
