################################################################################
# This workflow file is part of the chain of workflows focused on testing
# EUI changes in Kibana as part of our regression integration testing.
#
# This workflow is dispatched from `release.yml` after a snapshot is published
# and should not be run manually.
#
# Due to technical limitations and security rules, steps had to be divided
# into multiple subworkflows that must be triggered through
# `workflow_dispatch` and not the usual `workflow_call`.
################################################################################

name: 'Update Kibana dependencies - Prepare changes'

on:
  workflow_dispatch:
    inputs:
      dependencies:
        description: JSON-serialized map of dependencies to update
        type: string
        required: true
      pr_title:
        description: PR title
        required: true
        type: string
      pr_body:
        description: PR body
        type: string
      source_pr_number:
        description: Source PR number that triggered this workflow
        type: number
      nightly:
        description: Whether this is the scheduled nightly run
        type: boolean
        default: false
      eui_ref:
        description: EUI ref used to publish the snapshot
        type: string
        required: true
      eui_last_release:
        description: Latest stable EUI release reachable from the snapshot
        type: string
      eui_version:
        description: Published @elastic/eui snapshot version
        type: string
concurrency:
  group: ${{ inputs.nightly && 'kibana-nightly' || format('prepare-kibana-{0}', github.run_id) }}
  cancel-in-progress: false
  queue: max
permissions:
  id-token: write # Required for OIDC (Vault ephemeral token)
  contents: read
  actions: write # Required to dispatch the open-PR workflow

jobs:
  update:
    name: Prepare changes
    runs-on: ubuntu-latest
    steps:
      - name: Verify dependencies input
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        # language=bash
        run: |
          if ! num_deps="$(jq 'map(select(has("name") and has("version"))) | length' <<< "$DEPENDENCIES")"; then
            echo "::error::Invalid dependencies input"
            exit 2
          elif [[ "$num_deps" -eq 0 ]]; then
            echo "::warning::No dependencies to update"
            exit 1
          else
            echo "$num_deps dependencies to update"
          fi
      - name: Checkout the upstream elastic/kibana repository
        uses: actions/checkout@v6
        with:
          repository: elastic/kibana
          fetch-depth: 1
          persist-credentials: false # We use different credentials for other git operations
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false # Don't cache anything as it's a different repository
      - name: Fetch ephemeral GitHub token
        id: fetch_ephemeral_token
        uses: elastic/ci-gh-actions/fetch-github-token@v1.5.3
        with:
          vault-instance: ci-prod
          vault-role: token-policy-4fabc48bd03f
      - name: Configure git
        env:
          GH_TOKEN: ${{ steps.fetch_ephemeral_token.outputs.token }}
        # language=bash
        run: |
          gh auth setup-git
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add fork https://github.com/elastic/eui-kibana.git
      - name: Create new branch
        id: git_branch
        env:
          NIGHTLY: ${{ inputs.nightly }}
        # language=bash
        run: |
          # Nightly runs reuse a fixed branch; all other runs remain unique.
          if [[ "$NIGHTLY" == "true" ]]; then
            branch_name="nightly/update-dependencies"
          else
            branch_name="update-dependencies/$(date +%s)"
          fi
          git checkout -b "$branch_name"
          echo "BRANCH_NAME=$branch_name" >> "$GITHUB_OUTPUT"
          echo "::debug::Created branch '$branch_name'"
      - name: Cherry-pick Kibana prep commits
        id: cherry_pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # language=bash
        run: |
          set -euo pipefail

          content=$(gh api repos/elastic/eui/contents/packages/release-cli/kibana-prep-commits \
            --jq '.content' | base64 -d)

          # @previous first, then @next. Unsectioned URLs count as @next.
          prep_commits=$(awk '
            BEGIN { s="n" }
            /^# @previous/ { s="p"; next }
            /^# @next/ { s="n"; next }
            /^#/ || NF==0 { next }
            s=="p" { p = p $0 ORS }
            s=="n" { n = n $0 ORS }
            END { printf "%s%s", p, n }
          ' <<< "$content")

          if [[ -z "$prep_commits" ]]; then
            echo "No Kibana prep commits to cherry-pick"
            exit 0
          fi

          notes=""

          while IFS= read -r url; do
            pr_number=$(grep -oP '(?<=/pull/)\d+' <<< "$url")
            sha=$(grep -oP '[0-9a-f]{40}$' <<< "$url")

            if [[ -z "$pr_number" || -z "$sha" ]]; then
              echo "::warning::Could not parse URL: $url"
              continue
            fi

            echo "Cherry-picking $sha from PR #$pr_number"
            if ! git fetch origin "pull/$pr_number/head"; then
              echo "::warning::Skipping $sha: could not fetch PR #$pr_number"
              continue
            fi

            if ! git cat-file -e "${sha}^{commit}" 2>/dev/null; then
              echo "::warning::Skipping $sha: commit not on PR #$pr_number (force-pushed?)"
              continue
            fi

            # Incoming commit wins
            if git cherry-pick -X theirs "$sha"; then
              short_sha="${sha:0:8}"
              notes+="- [\`$short_sha\`](https://github.com/elastic/kibana/pull/$pr_number/commits/$sha) from elastic/kibana#$pr_number"$'\n'
            elif git diff --quiet && git diff --cached --quiet; then
              echo "Skipping $sha: already applied on this branch"
              git cherry-pick --skip
            else
              echo "::error::Cherry-pick of $sha from PR #$pr_number failed"
              echo "conflict_sha=$sha" >> "$GITHUB_OUTPUT"
              git cherry-pick --abort || true
              exit 1
            fi
          done <<< "$prep_commits"

          if [[ -n "$notes" ]]; then
            {
              echo 'cherry_pick_notes<<CHERRY_PICK_DELIMITER'
              printf '%s' "$notes"
              echo 'CHERRY_PICK_DELIMITER'
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Notify Slack of cherry-pick conflicts
        if: ${{ failure() && inputs.nightly && steps.cherry_pick.outputs.conflict_sha }}
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.KIBANA_NIGHTLY_SLACK_WEBHOOK }}
          EUI_REF: ${{ inputs.eui_ref }}
          EUI_LAST_RELEASE: ${{ inputs.eui_last_release }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # language=bash
        run: |
          set -euo pipefail
          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "::warning::KIBANA_NIGHTLY_SLACK_WEBHOOK is not set"
            exit 0
          fi
          compare_url="https://github.com/elastic/eui/compare/$EUI_LAST_RELEASE...$EUI_REF"
          slack_text=':red_circle: EUI nightly PR could not be updated because of cherry-pick conflicts'
          slack_text+=$'\n'"<$RUN_URL|GitHub Actions run> · <$compare_url|EUI main diff>"
          payload="$(jq -n --arg text "$slack_text" '{ text: $text }')"
          curl -fsSL -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
      - name: Save current EUI i18n tokens
        id: save_old_tokens
        # language=bash
        run: |
          set -euo pipefail

          # Kibana pins an exact @elastic/eui version in dependencies (no ^/~).
          current_version=$(node -pe "require('./package.json').dependencies['@elastic/eui'] || ''")
          if [[ ! "$current_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::Expected a pinned @elastic/eui version in dependencies, got: ${current_version:-<missing>}"
            exit 1
          fi

          old_tokens_path="$RUNNER_TEMP/eui_old_i18ntokens.json"
          package_file=$(npm pack "@elastic/eui@$current_version" --pack-destination "$RUNNER_TEMP" --silent)
          tar -xOf "$RUNNER_TEMP/$package_file" package/i18ntokens.json > "$old_tokens_path"

          echo "OLD_TOKENS_PATH=$old_tokens_path" >> "$GITHUB_OUTPUT"
      - name: Update dependency versions
        env:
          DEPENDENCIES: ${{ inputs.dependencies }}
        # language=bash
        run: |
          jq -j '.[] | .name, "\u0000", .version, "\u0000"' <<< "$DEPENDENCIES" |
          xargs -0 -n 2 bash -c '
            pkg="$0"
            ver="$1"
            if [[ $(npm pkg get "devDependencies.$pkg") != "{}" ]]; then
              npm pkg set "devDependencies.$pkg=$ver"
            elif [[ $(npm pkg get "dependencies.$pkg") != "{}" ]]; then
              npm pkg set "dependencies.$pkg=$ver"
            else
              echo "::warning::Skipping $pkg: Not found in either dependencies or devDependencies";
            fi'
      - name: Run Kibana bootstrap script and normalize dependencies
        # language=bash
        run: |
          set -euo pipefail
          # Retry a few times, npm can lag behind yarn.
          for attempt in 1 2 3 4 5; do
            if yarn kbn bootstrap; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              exit 1
            fi
            echo "bootstrap failed (attempt ${attempt}/5); retrying in 60s"
            sleep 60
          done
          node scripts/yarn_deduplicate
          yarn kbn bootstrap --force-install
      - name: Sync EUI i18n tokens
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLD_TOKENS: ${{ steps.save_old_tokens.outputs.OLD_TOKENS_PATH }}
          MAPPING_DIR: src/core/packages/i18n/browser-internal
          # Load trusted workflow code, never code from the tested snapshot.
          EUI_WORKFLOW_REF: ${{ github.workflow_sha }}
        # language=bash
        run: |
          set -euo pipefail

          mapping_file="$MAPPING_DIR/src/i18n_eui_mapping.tsx"
          NEW_TOKENS=$(node -e "console.log(require.resolve('@elastic/eui/i18ntokens.json'))" 2>/dev/null || true)
          if [[ -z "$NEW_TOKENS" || ! -f "$mapping_file" ]]; then
            echo "::error::Cannot locate the installed EUI tokens or Kibana mapping"
            exit 1
          fi

          # Handles strings, interpolation, plurals, and token additions, changes,
          # or removals. Preserves Kibana comments and translator descriptions.
          # Unknown function forms fail instead of creating an incomplete mapping.
          sync_script="$RUNNER_TEMP/sync_kibana_i18n.mjs"
          gh api "repos/elastic/eui/contents/scripts/sync_kibana_i18n.mjs?ref=${EUI_WORKFLOW_REF}" \
            --header "Accept: application/vnd.github.raw" \
            > "$sync_script"
          node "$sync_script" \
            --old-tokens "$OLD_TOKENS" \
            --new-tokens "$NEW_TOKENS" \
            --mapping-file "$mapping_file"

          if ! git diff --quiet "$mapping_file"; then
            node scripts/eslint --fix "$mapping_file"
            node scripts/jest --config "$MAPPING_DIR/jest.config.js" --updateSnapshot
          fi

          # Catch missing snapshot tokens before committing.
          node scripts/type_check --project "$MAPPING_DIR/tsconfig.json"

          git add "$mapping_file"
          git add "$MAPPING_DIR/src/__snapshots__"
          git diff --cached --quiet || git commit -m "chore: sync EUI i18n tokens"
      - name: Commit changed files
        # language=bash
        run: |
          git add package.json yarn.lock src/platform/packages/private/kbn-ui-shared-deps-npm/version_dependencies.txt
          git commit -m "chore: update dependencies"
      - name: Push branch to elastic/eui-kibana
        env:
          GH_TOKEN: ${{ steps.fetch_ephemeral_token.outputs.token }}
          BRANCH_NAME: ${{ steps.git_branch.outputs.BRANCH_NAME }}
          NIGHTLY: ${{ inputs.nightly }}
        # language=bash
        run: |
          if [[ "$NIGHTLY" == "true" ]]; then
            git push -u --force fork "$BRANCH_NAME"
          else
            git push -u fork "$BRANCH_NAME"
          fi
      - name: Trigger workflow to open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          CHERRY_PICK_NOTES: ${{ steps.cherry_pick.outputs.cherry_pick_notes }}
          BRANCH_NAME: ${{ steps.git_branch.outputs.BRANCH_NAME }}
          SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
          NIGHTLY: ${{ inputs.nightly }}
          EUI_REF: ${{ inputs.eui_ref }}
          EUI_LAST_RELEASE: ${{ inputs.eui_last_release }}
          EUI_VERSION: ${{ inputs.eui_version }}
        # language=bash
        run: |
          set -euo pipefail

          if [[ -n "${CHERRY_PICK_NOTES:-}" ]]; then
            PR_BODY="${PR_BODY}"$'\n\n'"### Cherry-picked commits"$'\n\n'"${CHERRY_PICK_NOTES}"
          fi

          # --repo is required because we're in the context of elastic/kibana right now
          args=(
            --repo elastic/eui
            -f "pr_title=$PR_TITLE"
            -f "pr_body=$PR_BODY"
            -f "pr_head=$BRANCH_NAME"
            -f "nightly=$NIGHTLY"
            -f "eui_ref=$EUI_REF"
            -f "eui_last_release=$EUI_LAST_RELEASE"
            -f "eui_version=$EUI_VERSION"
          )
          # An empty value is invalid for a number-typed workflow input.
          if [[ -n "${SOURCE_PR_NUMBER:-}" ]]; then
            args+=( -f "source_pr_number=$SOURCE_PR_NUMBER" )
          fi
          workflow_url=$(gh workflow run update_kibana_dependencies__open_pr.yml "${args[@]}")

          {
            echo "### Success :rocket:"
            echo ""
            echo "* Changes are prepared and pushed: https://github.com/elastic/eui-kibana/tree/$BRANCH_NAME"
            echo "* Pull request creation workflow triggered: $workflow_url"
          } >> "$GITHUB_STEP_SUMMARY"
