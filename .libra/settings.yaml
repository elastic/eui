version: 1
enabled: true

# EUI PRs are frequently opened as drafts for early feedback; review them on
# request by adding the bypass label rather than on every push.
review_drafts: false
skip_labels:
  - libra-skip
draft_bypass_labels:
  - libra-review-draft

paths:
  exclude:
    # Dependencies and lockfiles
    - "yarn.lock"
    # Keep .yarn/patches reviewed; they are real changes to dependency code
    - ".yarn/releases/**"
    - ".yarn/plugins/**"
    # Yearly changelogs are collated by the release script
    - "packages/*/changelogs/CHANGELOG_*.md"
    # Generated by i18n tooling
    - "packages/eui/i18ntokens.json"
    - "packages/eui/i18ntokens_changelog.json"
    # Jest snapshots are regenerated, review the tests that produce them
    - "**/__snapshots__/**"
    # Icon SVG sources and the components generated from them
    - "packages/eui/src/components/icon/svgs/**"
    - "packages/eui/src/components/icon/assets/**"

publication:
  # Drop wording/naming/comment-only notes; they are noise on small, frequent PRs.
  publish_min_severity: P3
  block_min_severity: P1
  verify_min_severity: P1
  # A flaky specialist should not silence findings from the ones that finished.
  allow_partial_coverage: true
